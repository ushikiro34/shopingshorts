<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOG IN · couparvi</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable.css" />
  <link rel="stylesheet" href="/static/styles.css?v={{ static_version() }}">
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>WELCOME · COUPARVI</h1>
      <form method="post" action="/login">
        <div class="field">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-primary" type="submit">LOG IN</button>
        {% if error %}
        <div class="error-text">{{ error }}</div>
        {% endif %}
      </form>
    </div>
  </div>
</body>

</html>
