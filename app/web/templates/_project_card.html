<a class="bg-[#F9F7F5] rounded-xl border border-outline-variant overflow-hidden soft-lift group cursor-pointer hover:-translate-y-1 transition-transform duration-300" href="/{{ p.tab }}?selected={{ p.id }}&view=detail">
<div class="aspect-[9/16] w-full relative bg-surface-container-high overflow-hidden">
{% if p.image_url %}
<div class="bg-cover bg-center w-full h-full group-hover:scale-105 transition-transform duration-700" style="background-image: url('{{ p.image_url }}')"></div>
{% else %}
<div class="w-full h-full flex flex-col items-center justify-center gap-2 bg-gradient-to-br from-secondary-container to-primary-fixed-dim/40 text-on-secondary-container">
<svg class="w-7 h-7 opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h2l1.5-2h9L18 7h2a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
<span class="font-label-sm text-label-sm opacity-70">제작 준비 중</span>
</div>
{% endif %}
<div class="absolute top-2 left-2 bg-secondary-container/90 backdrop-blur-sm text-on-secondary-container px-2 py-0.5 rounded-full font-label-sm text-label-sm flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full {% if p.status_tier >= 4 %}bg-[#10b981]{% else %}bg-primary{% endif %}"></span>
                {{ p.status_label }}
            </div>
</div>
<div class="p-2.5">
<h3 class="font-headline-md text-body-lg text-on-surface mb-0.5 truncate">{{ p.name }}</h3>
<p class="font-label-sm text-label-sm truncate">
<span class="text-primary">{{ p.category }}</span>
<span class="text-outline"> · {{ p.created_date }}</span>
</p>
</div>
</a>
