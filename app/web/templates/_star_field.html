<div class="star-field" aria-hidden="true"></div>
<script>
  (function () {
    var field = document.querySelector(".star-field");
    if (!field) return;
    var COUNT = 140;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < COUNT; i++) {
      var bright = Math.random() < 0.12;
      var size = bright ? (2.4 + Math.random() * 1.6) : (1 + Math.random() * 1.3);
      var star = document.createElement("span");
      star.className = bright ? "star star-bright" : "star";
      star.style.left = (Math.random() * 100) + "%";
      star.style.top = (Math.random() * 100) + "%";
      star.style.width = size + "px";
      star.style.height = size + "px";
      star.style.animationDelay = (Math.random() * 8) + "s";
      star.style.animationDuration = (2.5 + Math.random() * 4) + "s";
      star.style.setProperty("--peak", bright ? (0.85 + Math.random() * 0.15) : (0.35 + Math.random() * 0.35));
      frag.appendChild(star);
    }
    field.appendChild(frag);
  })();
</script>
